<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RideSure | 혼잡 기반 대중교통 경로 안내</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root { color-scheme: light; }
    html, body { min-height: 100%; margin: 0; font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif; }
    body { background: #edf3f7; color: #153047; }
    #app { min-height: 100vh; }
    @media (min-width: 768px) { #app { height: 100vh; } }
    #map { width: 100%; height: 100%; }
    .panel { background: #fff; border: 1px solid #dce7ef; border-radius: 24px; box-shadow: 0 14px 35px rgba(19, 55, 78, .07); }
    .eyebrow { color: #0b7792; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .brand-image { display: block; width: 165px; height: auto; }
    .brand-fallback { color: #0b5276; font-size: 27px; font-weight: 850; letter-spacing: -.05em; }
    .input-field { width: 100%; padding: 13px 15px; border: 1.5px solid #cfdde7; border-radius: 14px; background: #f9fcfe; color: #18364d; outline: none; }
    .input-field:focus { border-color: #087c9d; box-shadow: 0 0 0 4px rgba(8, 124, 157, .12); }
    .search-option[aria-selected="true"] { background: #e8f5f8; color: #075f7b; }
    .result-card { border-radius: 22px; border: 1px solid #d9e5ed; background: #fff; box-shadow: 0 12px 28px rgba(19,55,78,.06); padding: 22px; }
    .result-card.current { border-color: #7dbdcb; box-shadow: 0 16px 36px rgba(14, 103, 128, .12); }
    .result-card.recommended { border-color: #5aa883; background: #fbfefc; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { min-width: 0; padding: 12px 14px; border: 1px solid #e5edf2; border-radius: 14px; background: #f8fbfd; }
    .metric-label { display: block; color: #637b8a; font-size: 11px; font-weight: 700; }
    .metric-value { display: block; margin-top: 5px; color: #18364d; font-size: 15px; font-weight: 750; }
    .likelihood-panel { border-radius: 18px; padding: 17px 18px; }
    .likelihood-panel strong { display: block; margin-top: 3px; font-size: 31px; line-height: 1.1; letter-spacing: -.04em; }
    .likelihood-high { background: #eaf8f1; color: #116a45; }
    .likelihood-medium { background: #eaf4fa; color: #075e83; }
    .likelihood-low { background: #fff3e9; color: #a34b15; }
    .likelihood-very-low { background: #fcebed; color: #a3223c; }
    .likelihood-unknown { background: #f1f4f7; color: #506575; }
    .option-badge { border-radius: 999px; padding: 5px 9px; background: #eaf3f8; color: #175b73; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .option-badge.recommend { background: #daf3e6; color: #116b44; }
    .option-card-button { width: 100%; text-align: left; }
    .option-card-button:focus-visible { outline: 3px solid #0b7f9d; outline-offset: 3px; }
    .map-shell { position: relative; }
    .map-caption { position: absolute; top: 18px; left: 18px; z-index: 5; border-radius: 13px; background: rgba(255,255,255,.94); padding: 10px 13px; box-shadow: 0 8px 20px rgba(0,0,0,.12); font-size: 12px; font-weight: 700; color: #315266; pointer-events: none; }
    .badge {
      background: #1f2937;
      color: #fff;
      border-radius: 9999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      border: 2px solid #fff;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      user-select: none;
    }
    .badge.boarding { background: #4338ca; }
    .badge.alighting { background: #047857; }
    .badge.transfer { background: #b45309; }
  </style>
</head>
<body>
  <div id="app" class="grid grid-cols-1 md:grid-cols-12">
    <aside class="md:col-span-5 xl:col-span-4 md:h-full flex flex-col md:overflow-y-auto">
      <div class="max-w-3xl mx-auto w-full px-5 py-6 md:p-7 space-y-5">
        <div class="panel px-6 py-5">
          <img src="/static/assets/ridesure-logo.png" alt="" class="brand-image" onerror="this.hidden=true;document.getElementById('brand-fallback').hidden=false" />
          <span id="brand-fallback" class="brand-fallback" hidden>RideSure</span>
          <h1 class="sr-only">RideSure</h1>
          <p class="eyebrow mt-4">내 버스, 지금 탈 만할까?</p>
          <p class="mt-2 text-sm text-slate-600 leading-relaxed">과거 재차인원으로 탑승 가능성을 살피고 경로를 비교하세요.</p>
        </div>

        <div class="panel px-6 py-6">
          <div class="space-y-4">
            <div>
              <label for="origin-input" class="block text-sm font-semibold mb-2">출발지</label>
              <input
                id="origin-input"
                type="text"
                placeholder="정류장 이름 일부를 입력하세요"
                autocomplete="off" aria-autocomplete="list" aria-controls="origin-candidates"
                class="input-field"
              />
              <div id="origin-candidates" class="hidden mt-2 max-h-52 overflow-y-auto rounded-xl border border-slate-200 bg-white shadow-lg" role="listbox" aria-label="출발 정류장 검색 결과"></div>
            </div>

            <div>
              <label for="dest-input" class="block text-sm font-semibold mb-2">도착지</label>
              <input
                id="dest-input"
                type="text"
                placeholder="정류장 이름 일부를 입력하세요"
                autocomplete="off" aria-autocomplete="list" aria-controls="dest-candidates"
                class="input-field"
              />
              <div id="dest-candidates" class="hidden mt-2 max-h-52 overflow-y-auto rounded-xl border border-slate-200 bg-white shadow-lg" role="listbox" aria-label="도착 정류장 검색 결과"></div>
            </div>

            <p class="text-xs text-slate-500">검색 결과에서 정류장을 선택하면 노선과 방향을 확인할 수 있습니다.</p>
            <div class="grid grid-cols-2 gap-3">
              <div>
              <label for="date-input" class="block text-sm font-semibold mb-2">조회일</label>
              <input
                id="date-input"
                type="date"
                value="2025-11-08"
                class="input-field"
              />
              </div>
              <div>
              <label for="time-input" class="block text-sm font-semibold mb-2">출발 시각</label>
              <input
                id="time-input"
                type="time"
                value="09:00"
                class="input-field"
              />
              </div>
            </div>

            <button
              id="predict-btn"
              class="w-full py-3.5 bg-[#087a99] text-white font-bold rounded-xl hover:bg-[#096581] transition disabled:bg-gray-400 disabled:cursor-not-allowed text-base"
            >
              경로 조회
            </button>
          </div>

          <!-- 상태 메시지 -->
          <div id="status" class="hidden" role="status" aria-live="polite"></div>
        </div>

        <div id="results-section" class="hidden">
          <div class="mb-3 px-1">
            <h2 class="text-xl font-extrabold text-[#18364d]">경로 비교</h2>
            <p class="mt-1 text-xs text-slate-500">탑승 가능성은 과거 상대 혼잡에 따른 범주형 안내입니다.</p>
          </div>
          <div id="routes-container" class="space-y-4">
          </div>
        </div>
      </div>
    </aside>

    <main class="map-shell md:col-span-7 xl:col-span-8 h-[60vh] md:h-full">
      <div id="map"></div>
    </main>
  </div>

  <script>
    const API_BASE = '';  // 같은 서버에서 서빙하므로 상대 경로

    const originInput = document.getElementById('origin-input');
    const destInput = document.getElementById('dest-input');
    const originCandidates = document.getElementById('origin-candidates');
    const destCandidates = document.getElementById('dest-candidates');
    const dateInput = document.getElementById('date-input');
    const timeInput = document.getElementById('time-input');
    const predictBtn = document.getElementById('predict-btn');
    const statusEl = document.getElementById('status');
    const resultsSection = document.getElementById('results-section');
    const routesContainer = document.getElementById('routes-container');

    // 카카오 지도 초기화 후 연결되는 함수들
    let updateMapByText = null;
    let updateMapByRoute = null;
    let updateMapByItinerary = null;
    let clearInputMap = null;
    let pendingMapRoute = null;
    let optionMapButtons = [];
    let routeRequestVersion = 0;
    const selectedStops = { origin: null, destination: null };

    function isFiniteCoordinate(value, min, max) {
      const number = Number(value);
      return Number.isFinite(number) && number >= min && number <= max;
    }

    function normalizeCoordinate(value) {
      if (!value || typeof value !== 'object') return null;
      if (value.lat === null || value.lat === undefined || value.lat === '' ||
          value.lon === null || value.lon === undefined || value.lon === '') return null;
      const lat = Number(value.lat);
      const lon = Number(value.lon);
      if (!isFiniteCoordinate(lat, -90, 90) || !isFiniteCoordinate(lon, -180, 180)) {
        return null;
      }
      return { lat, lon };
    }

    function setupStopAutocomplete(input, list, key) {
      let version = 0;
      let timer = null;
      let options = [];
      let activeIndex = -1;
      function hideResults() {
        list.classList.add('hidden');
        list.replaceChildren();
        input.setAttribute('aria-expanded', 'false');
        input.setAttribute('aria-activedescendant', '');
        options = [];
        activeIndex = -1;
      }

      function activate(index) {
        if (!options.length) return;
        activeIndex = (index + options.length) % options.length;
        options.forEach(({ node }, position) => {
          node.setAttribute('aria-selected', position === activeIndex ? 'true' : 'false');
        });
        input.setAttribute('aria-activedescendant', options[activeIndex].node.id);
        if (typeof options[activeIndex].node.scrollIntoView === 'function') {
          options[activeIndex].node.scrollIntoView({ block: 'nearest' });
        }
      }

      function choose(stop) {
        version += 1;
        selectedStops[key] = {
          stop_id: stop.stop_id, stop_name: stop.stop_name,
          occurrence_id: stop.occurrence_id || null
        };
        input.value = stop.stop_name;
        hideResults();
      }

      async function search(query, currentVersion) {
        try {
          const params = new URLSearchParams({ q: query, limit: '10' });
          const response = await fetch(`/api/stops/search?${params.toString()}`);
          if (!response.ok) throw new Error('정류장 검색 실패');
          const data = await response.json();
          if (currentVersion !== version || selectedStops[key]) return;

          list.replaceChildren();
          options = [];
          const stops = Array.isArray(data.stops) ? data.stops : [];
          if (!stops.length) {
            list.appendChild(element('p', 'px-3 py-2 text-sm text-gray-500', '일치하는 정류장이 없습니다.'));
          }
          stops.forEach(stop => {
            if (!stop.stop_id || !stop.stop_name) return;
            const option = element('button', 'search-option block w-full border-b border-slate-100 px-3 py-2.5 text-left hover:bg-[#e8f5f8]', null);
            option.type = 'button';
            option.id = `${key}-candidate-${options.length}`;
            option.setAttribute('role', 'option');
            option.setAttribute('aria-selected', 'false');
            option.appendChild(element('span', 'block text-sm font-semibold text-gray-900', stop.stop_name));
            if (stop.match_kind === 'VERIFIED_OFFICIAL_ALIAS' && stop.official_stop_name) {
              option.appendChild(element('span', 'block text-xs text-indigo-700',
                `현재 명칭: ${stop.official_stop_name}`));
            }
            const lines = Array.isArray(stop.line_names) ? stop.line_names : [];
            const shortLines = lines.slice(0, 3).join(' · ');
            const remainder = lines.length > 3 ? ` · 외 ${lines.length - 3}개 노선` : '';
            option.appendChild(element('span', 'block text-xs text-gray-500',
              shortLines ? `${shortLines}${remainder}` : '노선 정보 없음'));
            option.addEventListener('click', () => choose(stop));
            list.appendChild(option);
            options.push({ node: option, stop });
          });
          list.classList.remove('hidden');
          input.setAttribute('aria-expanded', 'true');
        } catch (error) {
          if (currentVersion !== version) return;
          list.replaceChildren(element('p', 'px-3 py-2 text-sm text-red-600', '정류장 검색을 사용할 수 없습니다. 잠시 후 다시 시도하세요.'));
          list.classList.remove('hidden');
          input.setAttribute('aria-expanded', 'true');
        }
      }

      input.addEventListener('keydown', event => {
        if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && options.length) {
          event.preventDefault();
          activate(activeIndex + (event.key === 'ArrowDown' ? 1 : -1));
        } else if (event.key === 'Enter' && options.length) {
          event.preventDefault();
          choose(options[activeIndex < 0 ? 0 : activeIndex].stop);
        } else if (event.key === 'Escape' && options.length) {
          event.preventDefault();
          hideResults();
        } else if (event.key === 'Enter' && selectedStops.origin && selectedStops.destination) {
          event.preventDefault();
          predictRoute();
        }
      });

      input.addEventListener('input', () => {
        routeRequestVersion += 1;
        selectedStops[key] = null;
        statusEl.className = 'hidden';
        statusEl.textContent = '';
        resultsSection.classList.add('hidden');
        pendingMapRoute = null;
        if (typeof updateMapByRoute === 'function') updateMapByRoute(null);
        if (typeof clearInputMap === 'function') clearInputMap();
        version += 1;
        clearTimeout(timer);
        hideResults();
        const query = input.value.trim();
        if (query) {
          const currentVersion = version;
          timer = setTimeout(() => search(query, currentVersion), 180);
        }
      });

      input.addEventListener('focus', () => {
        if (input.value.trim() && !selectedStops[key]) input.dispatchEvent(new Event('input'));
      });
    }

    setupStopAutocomplete(originInput, originCandidates, 'origin');
    setupStopAutocomplete(destInput, destCandidates, 'destination');

    async function predictRoute() {
      const origin = originInput.value.trim();
      const dest = destInput.value.trim();
      const date = dateInput.value;
      const time = timeInput.value;

      if (!origin || !dest || !date || !time) {
        statusEl.textContent = '⚠️ 출발지, 도착지, 조회일, 출발 시각을 모두 입력하세요.';
        statusEl.className = 'mt-4 p-4 rounded-xl bg-red-50 text-sm text-red-700';
        return;
      }
      if (!selectedStops.origin || !selectedStops.destination) {
        statusEl.textContent = '출발지와 도착지의 정류장 검색 결과를 각각 선택하세요.';
        statusEl.className = 'mt-4 p-4 rounded-xl bg-red-50 text-sm text-red-700';
        return;
      }

      try {
        const requestVersion = routeRequestVersion;
        predictBtn.disabled = true;
        predictBtn.textContent = '경로 조회 중...';
        statusEl.textContent = '경로를 찾고 있습니다...';
        statusEl.className = 'mt-4 p-4 rounded-xl bg-blue-50 text-sm text-gray-700';
        resultsSection.classList.add('hidden');
        pendingMapRoute = null;
        if (typeof updateMapByRoute === 'function') updateMapByRoute(null);


        // 지오코딩 성공 시 지도 마커 표시와 함께 API 요청 좌표로 사용한다.
        let inputCoordinates = null;
        if (typeof updateMapByText === 'function') {
          try {
            inputCoordinates = await updateMapByText(origin, dest);
          } catch (error) {
            // 좌표가 없어도 정류장 이름 기반 조회는 계속 진행한다.
            console.warn('입력 위치 지오코딩 실패:', error);
            statusEl.textContent = '위치 좌표 없이 정류장 이름으로 경로를 조회합니다...';
          }
        }
        if (requestVersion !== routeRequestVersion) return;

        const requestBody = {
          origin,
          destination: dest,
          departure_time: time,
          date
        };
        requestBody.origin_stop_id = selectedStops.origin.stop_id;
        requestBody.destination_stop_id = selectedStops.destination.stop_id;
        if (selectedStops.origin.occurrence_id) {
          requestBody.origin_occurrence_id = selectedStops.origin.occurrence_id;
        }
        if (selectedStops.destination.occurrence_id) {
          requestBody.destination_occurrence_id = selectedStops.destination.occurrence_id;
        }
        if (inputCoordinates?.origin && inputCoordinates?.destination) {
          requestBody.origin_lat = inputCoordinates.origin.lat;
          requestBody.origin_lon = inputCoordinates.origin.lon;
          requestBody.destination_lat = inputCoordinates.destination.lat;
          requestBody.destination_lon = inputCoordinates.destination.lon;
        }

        // FastAPI 백엔드 호출
        const response = await fetch('/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });


        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || '서버 오류');
        }

        const data = await response.json();
        if (requestVersion !== routeRequestVersion) return;

        if (!data.success) {
          throw new Error(data.message || data.detail || '조회 가능한 경로가 없습니다.');
        }

        displayResults(data);
        statusEl.textContent = '';
        statusEl.className = 'hidden';

      } catch (e) {
        statusEl.textContent = `❌ 오류: ${e.message}`;
        statusEl.className = 'mt-4 p-4 rounded-xl bg-red-50 text-sm text-red-700';
        console.error('❌ 예측 실패:', e);
      } finally {
        predictBtn.disabled = false;
        predictBtn.textContent = '경로 조회';
      }
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function stopName(stop) {
      if (typeof stop === 'string') return stop;
      if (!stop || typeof stop !== 'object') return '';
      return stop.name || stop.stop_name || '';
    }

    const congestionStyles = {
      LOW: { label: '여유', className: 'bg-green-50 text-green-800', dot: 'bg-green-500' },
      MEDIUM: { label: '보통', className: 'bg-yellow-50 text-yellow-800', dot: 'bg-yellow-500' },
      HIGH: { label: '혼잡', className: 'bg-orange-50 text-orange-800', dot: 'bg-orange-500' },
      VERY_HIGH: { label: '매우 혼잡', className: 'bg-red-50 text-red-800', dot: 'bg-red-500' },
      UNKNOWN: { label: '정보 없음', className: 'bg-gray-100 text-gray-600', dot: 'bg-gray-400' }
    };

    function durationLabel(seconds) {
      return Number.isInteger(seconds) && seconds > 0 ? `${Math.max(1, Math.round(seconds / 60))}분` : null;
    }

    function evidenceRow(route) {
      const row = element('div', 'mt-3 flex flex-wrap items-center gap-2 text-sm');
      const style = congestionStyles[route.congestion_level] || congestionStyles.UNKNOWN;
      row.appendChild(element('span', 'rounded-full bg-indigo-50 px-3 py-1 font-semibold text-indigo-800',
        `탑승 가능성 ${route.boarding_likelihood_label || '판단 불가'}`));
      const level = element('span', `inline-flex items-center gap-2 rounded-full px-3 py-1 font-semibold ${style.className}`);
      level.appendChild(element('span', `h-2.5 w-2.5 rounded-full ${style.dot}`));
      level.appendChild(element('span', '', `상대 혼잡 ${style.label}`));
      row.appendChild(level);
      const countText = route.onboard_count === null || route.onboard_count === undefined
        ? '재차인원 정보 없음' : `재차인원 ${route.onboard_count}명`;
      row.appendChild(element('span', 'rounded-full bg-slate-100 px-3 py-1 text-slate-700', countText));
      const duration = route.travel_time_source === 'KAKAO_VERIFIED_TRANSIT_ROUTE'
        ? durationLabel(route.estimated_travel_time_seconds) : null;
      const busDuration = durationLabel(route.bus_duration_seconds);
      if (route.hops && busDuration) row.appendChild(element('span',
        'rounded-full bg-slate-100 px-3 py-1 text-slate-700', `버스 이동시간 약 ${busDuration}`));
      else if (!route.hops && duration) row.appendChild(element('span',
        'rounded-full bg-slate-100 px-3 py-1 text-slate-700', `예상 소요시간 약 ${duration}`));
      const stops = Array.isArray(route.stops) ? route.stops.length : 0;
      if (stops) row.appendChild(element('span', 'rounded-full bg-slate-100 px-3 py-1 text-slate-700', `${stops}정류장`));
      return row;
    }

    function metricCell(label, value, note = null) {
      const cell = element('div', 'metric');
      cell.appendChild(element('span', 'metric-label', label));
      cell.appendChild(element('strong', 'metric-value', value));
      if (note) cell.appendChild(element('span', 'block mt-1 text-[11px] text-slate-500', note));
      return cell;
    }

    function optionTime(option) {
      if (option.travel_time_source === 'KAKAO_VERIFIED_TRANSIT_ROUTE'
          && Number.isInteger(option.estimated_travel_time_minutes)) {
        return { label: '예상 소요시간', value: `약 ${option.estimated_travel_time_minutes}분`, note: null };
      }
      if (option.option_type === 'ONE_TRANSFER' && Number.isInteger(option.bus_travel_time_sum_minutes)) {
        return { label: '버스 이동시간 합계', value: `약 ${option.bus_travel_time_sum_minutes}분`, note: '환승 대기시간 제외' };
      }
      return { label: '예상 소요시간', value: '정보 없음', note: null };
    }

    function showOptionOnMap(option, data) {
      if (option.option_type === 'ONE_TRANSFER') {
        const itinerary = data.itineraries?.[option.source_index];
        if (!itinerary) return;
        pendingMapRoute = { itinerary };
        if (typeof updateMapByItinerary === 'function') updateMapByItinerary(itinerary);
      } else {
        const route = data.routes?.[option.source_index];
        if (!route) return;
        pendingMapRoute = route;
        if (typeof updateMapByRoute === 'function') updateMapByRoute(route);
      }
      optionMapButtons.forEach(({ option: candidate, button }) => {
        const active = candidate === option;
        button.textContent = active ? '지도에 표시 중' : '지도에서 이 경로 보기';
        button.setAttribute('aria-pressed', String(active));
        button.className = `option-card-button rounded-xl px-3 py-2 text-xs font-bold ${active
          ? 'bg-[#eaf4f8] text-[#075f7b]' : 'border border-slate-200 text-[#0a718d] hover:bg-slate-50'}`;
      });
    }

    function createOptionCard(option, data) {
      const isCurrent = option.tag === 'CURRENT';
      const isRecommended = option.tag === 'RECOMMENDED';
      const card = element('article', `result-card ${isCurrent ? 'current' : isRecommended ? 'recommended' : ''} space-y-4`);
      const header = element('div', 'flex flex-wrap items-center gap-2');
      header.appendChild(element('span', `option-badge ${isRecommended ? 'recommend' : ''}`,
        isCurrent ? '기본 경로' : isRecommended ? '추천 대안' : '비교 경로'));
      for (const badge of option.badges || []) header.appendChild(element('span', 'option-badge', badge));
      card.appendChild(header);
      card.appendChild(element('h3', 'text-2xl font-extrabold tracking-tight text-[#17384e]', option.title || '경로 정보 없음'));
      const legs = Array.isArray(option.legs) ? option.legs : [];
      if (legs.length) card.appendChild(element('p', 'text-sm text-slate-600',
        `${legs[0].origin_name} → ${legs[legs.length - 1].destination_name}`));

      const likelihoodClass = {
        HIGH: 'likelihood-high', MEDIUM: 'likelihood-medium', LOW: 'likelihood-low',
        VERY_LOW: 'likelihood-very-low', UNKNOWN: 'likelihood-unknown'
      }[option.boarding_likelihood] || 'likelihood-unknown';
      const likelihood = element('div', `likelihood-panel ${likelihoodClass}`);
      const likelihoodHeading = element('div', 'flex items-center gap-2');
      likelihoodHeading.appendChild(element('span', 'text-xs font-extrabold', '탑승 가능성'));
      const likelihoodInfo = element('span', 'cursor-help text-[11px] font-semibold opacity-75', 'ⓘ 판단 기준');
      const likelihoodDescription = '과거 재차인원 기반 상대 혼잡 수준을 이용한 범주형 판단이며 실제 탑승 확률은 아닙니다.';
      likelihoodInfo.setAttribute('title', likelihoodDescription);
      likelihoodInfo.setAttribute('aria-label', likelihoodDescription);
      likelihoodInfo.setAttribute('tabindex', '0');
      likelihoodHeading.appendChild(likelihoodInfo);
      likelihood.appendChild(likelihoodHeading);
      likelihood.appendChild(element('strong', '', option.boarding_likelihood_label || '판단 불가'));
      card.appendChild(likelihood);

      const metrics = element('div', 'metric-grid');
      metrics.appendChild(metricCell('상대 혼잡', option.congestion_label || '정보 없음'));
      metrics.appendChild(metricCell('재차인원', option.onboard_count === null || option.onboard_count === undefined
        ? (option.transfer_count ? '구간별 표시' : '정보 없음') : `${option.onboard_count}명`));
      const time = optionTime(option);
      metrics.appendChild(metricCell(time.label, time.value, time.note));
      metrics.appendChild(metricCell('정류장 / 환승', `${option.stop_count}정류장 · 환승 ${option.transfer_count}회`));
      card.appendChild(metrics);

      if (legs.length === 2) {
        const details = element('div', 'rounded-2xl border border-slate-200 divide-y divide-slate-100');
        legs.forEach((leg, index) => {
          const row = element('div', 'px-4 py-3 text-sm');
          row.appendChild(element('div', 'font-bold text-[#18364d]', `${index + 1}구간 · ${leg.line_name}`));
          row.appendChild(element('div', 'mt-1 text-xs text-slate-600',
            `${leg.origin_name} → ${leg.destination_name}`));
          const busTime = durationLabel(leg.bus_duration_seconds);
          const count = leg.onboard_count === null || leg.onboard_count === undefined
            ? '재차인원 정보 없음' : `재차인원 ${leg.onboard_count}명`;
          row.appendChild(element('div', 'mt-1 text-xs text-slate-500',
            `${count} · 상대 혼잡 ${leg.congestion_label}${busTime ? ` · 버스 이동시간 약 ${busTime}` : ''}`));
          details.appendChild(row);
        });
        card.appendChild(details);
      }
      if (isRecommended && option.recommendation_reason) {
        const reason = element('div', 'rounded-xl border-l-4 border-emerald-500 bg-emerald-50 px-4 py-3 text-emerald-900');
        reason.appendChild(element('span', 'block text-[11px] font-extrabold', '추천 이유'));
        reason.appendChild(element('p', 'mt-1 text-sm font-semibold leading-relaxed', option.recommendation_reason));
        card.appendChild(reason);
      }
      const mapButton = element('button', 'option-card-button rounded-xl border border-slate-200 px-3 py-2 text-xs font-bold text-[#0a718d] hover:bg-slate-50',
        '지도에서 이 경로 보기');
      mapButton.type = 'button';
      mapButton.setAttribute('aria-pressed', 'false');
      mapButton.addEventListener('click', () => showOptionOnMap(option, data));
      optionMapButtons.push({ option, button: mapButton });
      card.appendChild(mapButton);
      return card;
    }

    function createRouteCard(route, index, recommended = false, reason = null) {
      const card = element(
        'article',
        `bg-white rounded-2xl shadow-sm p-5 border ${index === 0 ? 'border-indigo-300' : 'border-gray-200'}`
      );
      card.appendChild(element('div', 'text-xs font-bold text-indigo-700',
        recommended ? '추천 대안' : index === 0 ? '기본 경로' : '다른 직행'));
      card.appendChild(element('h3', 'text-2xl font-bold text-indigo-800', route.line_name || '노선 정보 없음'));
      card.appendChild(element('p', 'mt-2 text-sm font-medium text-gray-800',
        `${stopName(route.origin_stop) || '알 수 없음'} → ${stopName(route.destination_stop) || '알 수 없음'}`));
      card.appendChild(evidenceRow(route));
      if (recommended && reason) card.appendChild(element('p', 'mt-3 text-sm text-slate-700', reason));
      return card;
    }

    function completeLegCoordinates(leg) {
      if (leg?.map_geometry_source !== 'KAKAO_VERIFIED_BUS_PATH') return [];
      const geometry = Array.isArray(leg.map_geometry) ? leg.map_geometry : [];
      const points = geometry.map(normalizeCoordinate);
      return points.length >= 2 && points.every(Boolean) ? points : [];
    }

    function createTransferLeg(leg, number) {
      const section = element('section', `border-l-4 pl-4 py-1 ${number === 1 ? 'border-indigo-500' : 'border-emerald-600'}`);
      section.appendChild(element('div', 'text-xs font-semibold text-gray-500', `${number}구간`));
      section.appendChild(element('h4', 'mt-1 text-xl font-bold text-gray-900', leg.line_name || '노선 정보 없음'));
      section.appendChild(element('p', 'mt-1 text-sm font-medium text-gray-800',
        `${stopName(leg.origin_stop) || '알 수 없음'} → ${stopName(leg.destination_stop) || '알 수 없음'}`));
      section.appendChild(evidenceRow(leg));
      return section;
    }

    function createItineraryCard(itinerary, origin, destination, index, recommended = false, reason = null) {
      const legs = Array.isArray(itinerary?.legs) ? itinerary.legs : [];
      if (legs.length !== 2) return null;
      const transfer = itinerary.transfer || {};
      const card = element('article',
        `bg-white rounded-2xl shadow-sm p-5 border ${index === 0 ? 'border-indigo-300' : 'border-gray-200'} space-y-5`);
      card.appendChild(element('h3', 'text-lg font-bold text-gray-900',
        recommended ? '추천 대안 · 1회 환승' : '1회 환승'));
      card.appendChild(element('p', 'text-sm font-semibold text-indigo-800',
        `탑승 가능성 ${itinerary.boarding_likelihood_label || '판단 불가'}`));
      if (reason) card.appendChild(element('p', 'text-sm text-slate-700', reason));
      const fullDuration = itinerary.travel_time_source === 'KAKAO_VERIFIED_TRANSIT_ROUTE'
        ? durationLabel(itinerary.estimated_travel_time_seconds) : null;
      const busSum = durationLabel(itinerary.bus_duration_sum_seconds);
      if (fullDuration) {
        card.appendChild(element('p', 'text-sm font-semibold text-indigo-800', `예상 소요시간 약 ${fullDuration}`));
      } else if (busSum) {
        card.appendChild(element('p', 'text-sm font-semibold text-indigo-800', `버스 이동시간 합계 약 ${busSum} (환승 대기시간 제외)`));
      }
      card.appendChild(createTransferLeg(legs[0], 1));

      const transferBox = element('section', 'border-l-4 border-amber-400 pl-4 py-1');
      transferBox.appendChild(element('div', 'text-xs font-bold text-amber-800', '환승'));
      transferBox.appendChild(element('p', 'text-sm font-medium text-gray-800',
        transfer.official_stop_name || '환승 정류장'));
      card.appendChild(transferBox);
      card.appendChild(createTransferLeg(legs[1], 2));
      return card;
    }

    function displayResults(data) {
      resultsSection.classList.remove('hidden');
      routesContainer.replaceChildren();

      const routes = Array.isArray(data.routes) ? data.routes : [];
      const itineraries = Array.isArray(data.itineraries) ? data.itineraries : [];
      const options = Array.isArray(data.route_options) ? data.route_options.slice(0, 3) : [];
      if (options.length) {
        optionMapButtons = [];
        options.forEach(option => routesContainer.appendChild(createOptionCard(option, data)));
        showOptionOnMap(options[0], data);
        return;
      }
      if (routes.length) {
        routes.forEach((route, index) => {
          const recommended = data.recommended_alternative?.kind === 'DIRECT'
            && data.recommended_alternative.index === index;
          routesContainer.appendChild(createRouteCard(route || {}, index, recommended,
            recommended ? data.recommendation_reason : null));
        });
        if (data.recommended_alternative?.kind === 'ONE_TRANSFER') {
          const index = data.recommended_alternative.index;
          const itinerary = itineraries[index];
          const card = createItineraryCard(itinerary, data.origin, data.destination, index,
            true, data.recommendation_reason);
          if (card) {
            card.addEventListener('click', () => updateMapByItinerary(itinerary));
            routesContainer.appendChild(card);
          }
        }
        pendingMapRoute = routes[0];
        if (typeof updateMapByRoute === 'function') updateMapByRoute(routes[0]);
      } else if (itineraries.length) {
        itineraries.forEach((itinerary, index) => {
          const card = createItineraryCard(itinerary, data.origin, data.destination, index);
          if (card) routesContainer.appendChild(card);
        });
        pendingMapRoute = { itinerary: itineraries[0] };
        if (typeof updateMapByItinerary === 'function') updateMapByItinerary(itineraries[0]);
      } else {
        routesContainer.appendChild(element(
          'section',
          'bg-white rounded-2xl border border-gray-200 p-6 text-gray-700',
          '현재 데이터 범위에서 경로를 찾지 못했습니다.'
        ));
        routesContainer.appendChild(element('p', 'px-2 text-sm text-gray-500',
          '다른 인근 정류장을 선택하거나 출발지/도착지를 변경해 보세요.'));
        pendingMapRoute = null;
        if (typeof clearInputMap === 'function') clearInputMap();
        if (typeof updateMapByRoute === 'function') updateMapByRoute(null);
      }

    }

    // 이벤트 리스너
    predictBtn.addEventListener('click', predictRoute);

    console.log('✅ 페이지 로드 완료');

    /* ------------------- 카카오 지도 초기화 ------------------- */
    function showMapConfigurationError(message) {
      const mapElement = document.getElementById('map');
      mapElement.replaceChildren();
      mapElement.className = 'flex items-center justify-center bg-red-50 p-8 text-center text-red-700';

      const errorMessage = document.createElement('p');
      errorMessage.textContent = message;
      mapElement.appendChild(errorMessage);

      statusEl.textContent = `⚠️ ${message}`;
      statusEl.className = 'mt-4 p-4 rounded-xl bg-red-50 text-sm text-red-700';
    }

    async function loadKakaoMapsSdk() {
      const response = await fetch('/api/frontend-config', {
        headers: { 'Accept': 'application/json' },
        cache: 'no-store'
      });

      if (!response.ok) {
        let message = '카카오 지도 설정을 불러오지 못했습니다.';
        try {
          const errorData = await response.json();
          if (errorData.detail) message = errorData.detail;
        } catch (_) {
          // JSON 오류 응답이 아니면 기본 메시지를 사용한다.
        }
        throw new Error(message);
      }

      const runtimeConfig = await response.json();
      const appKey = runtimeConfig.kakao_map_javascript_key;
      if (typeof appKey !== 'string' || appKey.trim() === '') {
        throw new Error('카카오 지도 JavaScript 키가 설정되지 않았습니다.');
      }

      const query = new URLSearchParams({
        appkey: appKey,
        autoload: 'false',
        libraries: 'services'
      });

      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `https://dapi.kakao.com/v2/maps/sdk.js?${query.toString()}`;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(
          new Error('카카오 지도 SDK를 불러오지 못했습니다. 허용 도메인과 네트워크를 확인하세요.')
        );
        document.head.appendChild(script);
      });
    }

    async function initializeKakaoMap() {
      try {
        await loadKakaoMapsSdk();

        if (!globalThis.kakao?.maps) {
          throw new Error('카카오 지도 SDK가 올바르게 초기화되지 않았습니다.');
        }

        kakao.maps.load(() => {
          const DEFAULT_CENTER = new kakao.maps.LatLng(36.3504, 127.3845); // 대전 근처
          const map = new kakao.maps.Map(document.getElementById('map'), {
            center: DEFAULT_CENTER,
            level: 7
          });
          const geocoder = new kakao.maps.services.Geocoder();
          const places = new kakao.maps.services.Places();

          function makeBadge(label, position, variant = '') {
            const badge = document.createElement('div');
            badge.className = `badge ${variant}`.trim();
            badge.textContent = label;
            return new kakao.maps.CustomOverlay({
              position,
              content: badge,
              yAnchor: 1,
              zIndex: 9999
            });
          }

          let originOverlay = null;
          let destinationOverlay = null;
          let boardingOverlay = null;
          let alightingOverlay = null;
          let transferOverlay = null;
          let routePolyline = null;
          let transferPolylines = [];
          let routePositions = [];

          function setInputOverlay(current, label, coordinate) {
            const position = new kakao.maps.LatLng(coordinate.lat, coordinate.lon);
            if (!current) {
              current = makeBadge(label, position);
              current.setMap(map);
            } else {
              current.setPosition(position);
            }
            return current;
          }

          function fitMap(extraPositions = []) {
            const bounds = new kakao.maps.LatLngBounds();
            const positions = [...extraPositions];
            if (originOverlay) positions.push(originOverlay.getPosition());
            if (destinationOverlay) positions.push(destinationOverlay.getPosition());
            if (boardingOverlay) positions.push(boardingOverlay.getPosition());
            if (alightingOverlay) positions.push(alightingOverlay.getPosition());
            if (transferOverlay) positions.push(transferOverlay.getPosition());
            positions.forEach(position => bounds.extend(position));
            if (positions.length > 1) map.setBounds(bounds, 72, 56, 72, 56);
            else if (positions.length === 1) {
              map.setCenter(positions[0]);
              map.setLevel(5);
            }
          }

          function clearReturnedRoute() {
            if (routePolyline) routePolyline.setMap(null);
            transferPolylines.forEach(polyline => polyline.setMap(null));
            if (boardingOverlay) boardingOverlay.setMap(null);
            if (alightingOverlay) alightingOverlay.setMap(null);
            if (transferOverlay) transferOverlay.setMap(null);
            routePolyline = null;
            transferPolylines = [];
            boardingOverlay = null;
            alightingOverlay = null;
            transferOverlay = null;
            routePositions = [];
          }

          clearInputMap = () => {
            if (originOverlay) originOverlay.setMap(null);
            if (destinationOverlay) destinationOverlay.setMap(null);
            originOverlay = null;
            destinationOverlay = null;
          };

          function geocode(query) {
            return new Promise((resolve, reject) => {
              // 도로명/지번 주소를 우선하고, 검색어이면 장소 검색으로 보완한다.
              geocoder.addressSearch(query, (addressResults, addressStatus) => {
                if (addressStatus === kakao.maps.services.Status.OK && addressResults.length) {
                  const match = normalizeCoordinate({ lat: addressResults[0].y, lon: addressResults[0].x });
                  if (match) resolve(match);
                  else reject(new Error('유효하지 않은 주소 좌표'));
                  return;
                }
                places.keywordSearch(query, (placeResults, placeStatus) => {
                  if (placeStatus === kakao.maps.services.Status.OK && placeResults.length) {
                    const match = normalizeCoordinate({ lat: placeResults[0].y, lon: placeResults[0].x });
                    if (match) resolve(match);
                    else reject(new Error('유효하지 않은 장소 좌표'));
                  } else {
                    reject(new Error(`'${query}' 위치를 찾지 못했습니다.`));
                  }
                });
              });
            });
          }

          function routeCoordinates(route) {
            return completeLegCoordinates(route);
          }

          updateMapByRoute = route => {
            clearReturnedRoute();
            if (!route || typeof route !== 'object') {
              fitMap();
              return;
            }
            clearInputMap();

            const boardingCoordinate = normalizeCoordinate(route.origin_stop);
            const alightingCoordinate = normalizeCoordinate(route.destination_stop);
            const coordinates = routeCoordinates(route);
            routePositions = coordinates.map(point => new kakao.maps.LatLng(point.lat, point.lon));

            if (routePositions.length >= 2) {
              routePolyline = new kakao.maps.Polyline({
                path: routePositions,
                strokeWeight: 6,
                strokeColor: '#4f46e5',
                strokeOpacity: 0.85,
                strokeStyle: 'solid'
              });
              routePolyline.setMap(map);
            }

            if (boardingCoordinate) {
              const position = new kakao.maps.LatLng(boardingCoordinate.lat, boardingCoordinate.lon);
              boardingOverlay = makeBadge('출발', position, 'boarding');
              boardingOverlay.setMap(map);
            }
            if (alightingCoordinate) {
              const position = new kakao.maps.LatLng(alightingCoordinate.lat, alightingCoordinate.lon);
              alightingOverlay = makeBadge('도착', position, 'alighting');
              alightingOverlay.setMap(map);
            }
            fitMap(routePositions);
          };

          updateMapByItinerary = itinerary => {
            clearReturnedRoute();
            const legs = Array.isArray(itinerary?.legs) ? itinerary.legs : [];
            if (legs.length !== 2) {
              fitMap();
              return;
            }
            // Bounds use every validated BUS path point and the verified stop markers.
            clearInputMap();

            legs.forEach((leg, index) => {
              const points = completeLegCoordinates(leg);
              if (!points.length) return;
              const positions = points.map(point => new kakao.maps.LatLng(point.lat, point.lon));
              routePositions.push(...positions);
              const polyline = new kakao.maps.Polyline({
                path: positions,
                strokeWeight: 6,
                strokeColor: index === 0 ? '#4f46e5' : '#047857',
                strokeOpacity: 0.85,
                strokeStyle: 'solid'
              });
              polyline.setMap(map);
              transferPolylines.push(polyline);
            });

            const originPoint = normalizeCoordinate(legs[0].origin_stop);
            const destinationPoint = normalizeCoordinate(legs[1].destination_stop);
            const firstTransferPoint = normalizeCoordinate(legs[0].destination_stop);
            const secondTransferPoint = normalizeCoordinate(legs[1].origin_stop);
            const transferPoint = firstTransferPoint && secondTransferPoint &&
              firstTransferPoint.lat === secondTransferPoint.lat &&
              firstTransferPoint.lon === secondTransferPoint.lon ? firstTransferPoint : null;
            if (originPoint) {
              boardingOverlay = makeBadge('출발',
                new kakao.maps.LatLng(originPoint.lat, originPoint.lon), 'boarding');
              boardingOverlay.setMap(map);
            }
            if (destinationPoint) {
              alightingOverlay = makeBadge('도착',
                new kakao.maps.LatLng(destinationPoint.lat, destinationPoint.lon), 'alighting');
              alightingOverlay.setMap(map);
            }
            if (transferPoint) {
              transferOverlay = makeBadge('환승',
                new kakao.maps.LatLng(transferPoint.lat, transferPoint.lon), 'transfer');
              transferOverlay.setMap(map);
            }
            fitMap(routePositions);
          };

          // 텍스트 위치를 지도에 표시하고, API에 전달할 좌표를 반환한다.
          updateMapByText = async (origin, destination) => {
            if (!origin || !destination) return null;
            statusEl.textContent = '지도에서 출발/도착 위치를 찾는 중입니다...';
            const [originCoordinate, destinationCoordinate] = await Promise.all([
              geocode(origin),
              geocode(destination)
            ]);
            originOverlay = setInputOverlay(originOverlay, '출발', originCoordinate);
            destinationOverlay = setInputOverlay(destinationOverlay, '도착', destinationCoordinate);
            fitMap(routePositions);
            return { origin: originCoordinate, destination: destinationCoordinate };
          };

          if (pendingMapRoute?.itinerary) updateMapByItinerary(pendingMapRoute.itinerary);
          else if (pendingMapRoute) updateMapByRoute(pendingMapRoute);
        });
      } catch (error) {
        console.error('카카오 지도 초기화 실패');
        showMapConfigurationError(error.message);
      }
    }

    initializeKakaoMap();
  </script>
