services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:?Set NEO4J_USER in .env}/${NEO4J_PASS:?Set NEO4J_PASS in .env}"
      RIDESURE_NEO4J_USER: "${NEO4J_USER:?Set NEO4J_USER in .env}"
      RIDESURE_NEO4J_PASS: "${NEO4J_PASS:?Set NEO4J_PASS in .env}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u "$$RIDESURE_NEO4J_USER" -p "$$RIDESURE_NEO4J_PASS"
          "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  neo4j-v2:
    image: neo4j:5.26-community
    profiles: ["v2"]
    restart: unless-stopped
    ports:
      - "${NEO4J_V2_HTTP_PORT:-7475}:7474"
      - "${NEO4J_V2_BOLT_PORT:-7688}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:?Set NEO4J_USER in .env}/${NEO4J_PASS:?Set NEO4J_PASS in .env}"
      RIDESURE_NEO4J_USER: "${NEO4J_USER:?Set NEO4J_USER in .env}"
      RIDESURE_NEO4J_PASS: "${NEO4J_PASS:?Set NEO4J_PASS in .env}"
    volumes:
      - neo4j_v2_data:/data
      - neo4j_v2_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u "$$RIDESURE_NEO4J_USER" -p "$$RIDESURE_NEO4J_PASS"
          "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_v2_data:
  neo4j_v2_logs:
